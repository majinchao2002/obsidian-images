<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="710" viewBox="0 0 1500 710" role="img" aria-labelledby="title desc">
  <title id="title">Queue Penalty队列随时间变化对比</title>
  <desc id="desc">示意无队列惩罚、队列惩罚未平滑和队列惩罚加EMA三种情况下队列随时间的变化。</desc>
  <style>
    text { font-family: Arial, "PingFang SC", "Microsoft YaHei", sans-serif; fill: #1f2937; }
    .title { font-size: 28px; font-weight: 700; }
    .subtitle { font-size: 16px; fill: #64748b; }
    .axis { font-size: 14px; fill: #64748b; }
    .label { font-size: 15px; font-weight: 600; }
    .small { font-size: 14px; fill: #475569; }
    .gray { fill: none; stroke: #64748b; stroke-width: 3; }
    .red { fill: none; stroke: #dc2626; stroke-width: 3; }
    .blue { fill: none; stroke: #2563eb; stroke-width: 3.5; }
    .grid { stroke: #e2e8f0; stroke-width: 1; }
    .event { stroke: #94a3b8; stroke-width: 1.5; stroke-dasharray: 7 5; }
    .envelope { fill: none; stroke: #dc2626; stroke-width: 1.8; stroke-dasharray: 7 5; }
    .note { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .note-red { fill: #fff1f2; stroke: #dc2626; stroke-width: 2; }
    .note-blue { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; }
  </style>

  <rect width="1500" height="710" fill="#ffffff"/>
  <text x="35" y="44" class="title">Queue Penalty：队列随时间变化对比</text>
  <text x="35" y="72" class="subtitle">归一化示意图，用于说明反馈阶段和稳定性；首峰由在途数据决定，三种机制在首轮反馈前相同</text>

  <line x1="905" y1="43" x2="955" y2="43" class="gray"/>
  <text x="965" y="49" class="small">无 Penalty</text>
  <line x1="1080" y1="43" x2="1130" y2="43" class="red"/>
  <text x="1140" y="49" class="small">Penalty，无平滑</text>
  <line x1="1300" y1="43" x2="1350" y2="43" class="blue"/>
  <text x="1360" y="49" class="small">Penalty + EMA</text>

  <line x1="105" y1="115" x2="105" y2="470" stroke="#64748b" stroke-width="2"/>
  <line x1="105" y1="470" x2="1435" y2="470" stroke="#64748b" stroke-width="2"/>
  <line x1="105" y1="120" x2="1435" y2="120" class="grid"/>
  <line x1="105" y1="295" x2="1435" y2="295" class="grid"/>
  <text x="88" y="125" text-anchor="end" class="axis">W</text>
  <text x="88" y="300" text-anchor="end" class="axis">W/2</text>
  <text x="88" y="474" text-anchor="end" class="axis">0</text>
  <text x="38" y="300" transform="rotate(-90 38 300)" text-anchor="middle" class="label">队列 Q(t) / Credit 窗口 W</text>

  <line x1="235" y1="115" x2="235" y2="470" class="event"/>
  <line x1="405" y1="115" x2="405" y2="470" class="event"/>
  <line x1="535" y1="115" x2="535" y2="470" class="event"/>
  <text x="105" y="496" text-anchor="middle" class="axis">0</text>
  <text x="235" y="496" text-anchor="middle" class="axis">d</text>
  <text x="405" y="496" text-anchor="middle" class="axis">T</text>
  <text x="535" y="496" text-anchor="middle" class="axis">T+d</text>
  <text x="840" y="496" text-anchor="middle" class="axis">后续反馈周期</text>
  <text x="1435" y="496" text-anchor="end" class="axis">时间</text>

  <path d="M105 470 H235 L535 145 H1435" class="gray"/>
  <path d="M105 470 H235 L535 145 L650 332 L725 245 L800 405 L875 225 L950 410 L1025 195 L1100 415 L1175 170 L1250 418 L1325 150 L1400 415" class="red"/>
  <path d="M105 470 H235 L535 145 C590 205 625 255 680 285 C735 316 785 305 835 295 C885 285 935 300 985 295 C1060 290 1140 296 1220 294 C1300 292 1370 295 1435 294" class="blue"/>
  <path d="M725 235 L1325 140" class="envelope"/>

  <circle cx="535" cy="145" r="5" fill="#1f2937"/>
  <text x="555" y="135" class="label">共同首峰 Q_peak</text>
  <text x="555" y="158" class="small">反馈尚未到达，Penalty 无法提前阻止在途数据</text>
  <text x="1035" y="132" class="small">Credit Return 到达即被再次使用，维持高队列</text>
  <text x="1040" y="278" class="small" fill="#1d4ed8">EMA 后收敛到约一半窗口</text>
  <text x="940" y="205" class="small" fill="#b91c1c">R_out 增大 → 净入队斜率增大 → Q_max 上升</text>
  <text x="1100" y="445" class="small" fill="#b91c1c">原始采样导致开停切换和大幅振荡</text>

  <rect x="105" y="535" width="820" height="135" rx="7" class="note-red"/>
  <text x="130" y="565" class="label" fill="#b91c1c">未平滑的恢复分支：延迟反馈形成近似 2 倍增益</text>
  <text x="130" y="595" class="small">C_up≈0 且前一反馈区间没有新到达时：R_send(t) ≈ 2R_out(t-d)</text>
  <text x="130" y="622" class="small">队列在对应周期回到相近状态时，R_out 由前一发送阶段决定，因此近似出现：</text>
  <text x="130" y="651" class="label" fill="#b91c1c">R_s,0 → 2R_s,0 → 4R_s,0 → 线速上限 → Credit 再次归零停发</text>

  <rect x="955" y="535" width="480" height="135" rx="7" class="note-blue"/>
  <text x="980" y="565" class="label" fill="#1d4ed8">加入 EMA 后</text>
  <text x="980" y="595" class="small">Penalty 使用缓慢变化的 Q_ema，而不是瞬时 Q。</text>
  <text x="980" y="622" class="small">Q_ema 的导数不会直接变成 R_in-R_out，</text>
  <text x="980" y="649" class="small">2R_out 项不再出现，发送速率可逐步收敛。</text>
</svg>
